<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Kolam Puzzle</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div id="app">
      <div class="header">
        <h1 id="level-title">Kolam</h1>
        <div id="status-text" class="status">Connect the dots</div>
        <div class="controls">
          <button id="btn-undo" type="button">Undo</button>
          <button id="btn-restart" type="button">Restart</button>
        </div>
      </div>
      <div class="board-container">
        <svg id="kolam-board" viewBox="0 0 100 100"></svg>
      </div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
